services:
  mysql:
    image: mysql:8.0
    container_name: magento-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=2G
      - --performance_schema=ON
      - --log-bin-trust-function-creators=1
    networks:
      - internal   # <-- agregado: web necesita llegar a mysql por hostname
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: magento-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      #- plugins.security.disabled=true
      #- OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch-data:/usr/share/opensearch/data
    networks:
      - internal
    # Healthcheck real: espera que OpenSearch esté listo (tarda ~60s)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    container_name: magento-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis-data:/data
    networks:
      - internal   # <-- corregido: antes solo estaba en traefik
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  varnish:
    image: varnish:7.4
    container_name: magento-varnish
    restart: unless-stopped
    environment:
      - VARNISH_SIZE=${VARNISH_SIZE}
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    command: ["varnishd", "-F", "-f", "/etc/varnish/default.vcl", "-a", ":80", "-s", "malloc,${VARNISH_SIZE}"]
    networks:
      - traefik
      - internal
    depends_on:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.magento.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.magento.entrypoints=websecure"
      - "traefik.http.routers.magento.tls.certresolver=letsencrypt"
      - "traefik.http.routers.magento.service=magento"
      - "traefik.http.services.magento.loadbalancer.server.port=80"
      - "traefik.http.routers.magento-admin.rule=Host(`${DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.magento-admin.entrypoints=websecure"
      - "traefik.http.routers.magento-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.magento-admin.service=magento"

  web:
    build: .
    container_name: magento-web
    restart: unless-stopped
    environment:
      # Magento Config
      - MAGENTO_BASE_URL=${MAGENTO_BASE_URL}
      - MAGENTO_BASE_URL_SECURE=${MAGENTO_BASE_URL_SECURE}
      - MAGENTO_ADMIN_FIRSTNAME=${MAGENTO_ADMIN_FIRSTNAME}
      - MAGENTO_ADMIN_LASTNAME=${MAGENTO_ADMIN_LASTNAME}
      - MAGENTO_ADMIN_EMAIL=${MAGENTO_ADMIN_EMAIL}
      - MAGENTO_ADMIN_USER=${MAGENTO_ADMIN_USER}
      - MAGENTO_ADMIN_PASSWORD=${MAGENTO_ADMIN_PASSWORD}
      # Database Config
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # OpenSearch Config
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      # Redis Config
      - REDIS_HOST=${REDIS_HOST}
      # PHP Config
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME}
    volumes:
      - ./magento:/var/www/html
      - ./logs/nginx:/var/log/nginx
      - ./logs/php:/var/log/php
    networks:
      - internal   # web NO necesita estar en traefik; varnish es el proxy
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy   # <-- corregido: antes era service_started
      redis:
        condition: service_healthy   # <-- corregido: antes era service_started

networks:
  traefik:
    external: true
  internal:
    driver: bridge
